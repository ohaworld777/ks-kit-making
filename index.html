<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>항공드론과학 교구 만들기</title>
<style>
:root{--ink:#14213f;--muted:#5d6b86;--line:#e3e9f4;--bg:#f4f7fc;--brand:#1c6fd1;--accent:#7c4dff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Noto Sans CJK KR','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:1240px;margin:0 auto;height:68px;display:flex;align-items:center;gap:14px;padding:0 24px}
.hin img{height:40px;display:block}#homeA{display:flex;align-items:center}
.hin b{font-size:19px;letter-spacing:-.3px}
.hin .sep{width:1px;height:20px;background:var(--line)}
.hin small{color:var(--muted);font-size:14px;font-weight:600}
.search{margin-left:12px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:9px 16px;width:300px;color:var(--muted);font-size:14px}
.hero{background:linear-gradient(120deg,#22175e 0%,#5b4bdb 50%,#2f8fe0 100%);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 30%,rgba(255,255,255,.18),transparent 40%),radial-gradient(circle at 10% 120%,rgba(255,209,102,.25),transparent 45%)}
.heroin{position:relative;max-width:1240px;margin:0 auto;padding:44px 24px 92px}
.hero .kicker{display:inline-block;font-size:13px;font-weight:800;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:999px;letter-spacing:.5px}
.hero h1{font-size:40px;margin:14px 0 8px;letter-spacing:-1px}
.hero h1 span{color:#ffd166}
.hero p{opacity:.88;font-size:16px}
main{max-width:1240px;margin:-64px auto 0;padding:0 24px 60px;position:relative}
.tabs{display:flex;gap:12px;margin-bottom:22px}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid transparent;border-radius:18px;padding:14px 22px 14px 16px;box-shadow:0 8px 24px rgba(20,33,63,.08);cursor:pointer}
.tab .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--bg)}
.tab .m{font-size:13px;color:var(--muted);font-weight:700}
.tab .t{font-size:18px;font-weight:800}
.tab.on{border-color:var(--c);box-shadow:0 10px 28px rgba(20,33,63,.14)}
.tab.on .ic{background:var(--c);color:#fff}
.tab.soon{opacity:.75;box-shadow:none;background:rgba(255,255,255,.55);border:2px dashed #b9c6de;cursor:default;color:var(--muted)}
.mhead{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 2px 16px}
.mhead h2{font-size:26px;letter-spacing:-.5px}
.mhead h2 em{font-style:normal;color:var(--c)}
.mhead p{color:var(--muted);font-size:15px;margin-top:4px}
.view{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.view span{font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;color:var(--muted)}
.view span.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(20,33,63,.07);display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.thumb{position:relative;aspect-ratio:16/9;background:#dde5f2 center/cover}
.wk{position:absolute;left:12px;bottom:12px;background:rgba(15,25,50,.82);color:#fff;font-size:13px;font-weight:800;padding:6px 11px;border-radius:999px}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{font-size:18px;line-height:1.35;letter-spacing:-.3px}
.kit{align-self:flex-start;font-size:13px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);padding:5px 10px;border-radius:8px}
.goal{font-size:14px;color:var(--muted);line-height:1.55;flex:1}
.acts{display:flex;gap:8px;margin-top:4px}
.go{flex:1;text-align:center;background:var(--c);color:#fff;font-weight:800;font-size:15px;padding:11px 0;border-radius:12px;text-decoration:none}
.qr{width:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:800;color:var(--muted)}
.card.pend .thumb{background:repeating-linear-gradient(135deg,#eef2f9 0 14px,#e4eaf5 14px 28px);display:grid;place-items:center}
.card.pend .thumb .big{font-size:56px;opacity:.55}
.card.pend .thumb .lbl{position:absolute;bottom:14px;right:14px;color:#8a97b2;font-weight:900;font-size:13px;letter-spacing:1px}
.card.pend h3{color:#5d6b86}
.go.off{background:#e4eaf3;color:#8a97b2;cursor:default}
td.pd{color:#9aa6bf}
.card.mission{background:linear-gradient(160deg,#fff4e0,#ffe2c2);border-color:#ffcf99}
.card.mission .thumb{background:radial-gradient(circle at 50% 45%,#ffb347,#ff7a3d 60%,#e8522a);display:grid;place-items:center}
.card.mission .thumb .big{font-size:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2))}
.card.mission .thumb .lbl{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:15px;letter-spacing:1px}
.card.mission .go{background:#ff7a3d}
.card.mission .kit{color:#c4501f;background:#fff}
.legend{margin-top:26px;display:flex;gap:18px;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* 연간표 */
.year{background:#fff;border-radius:20px;border:1px solid var(--line);overflow:hidden;margin-top:34px}
.year h4{padding:16px 20px;font-size:16px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
th{background:#f8faff;color:var(--muted);font-size:13px}
td.mo{font-weight:800;white-space:nowrap}
td .k{display:block;font-size:12px;color:var(--muted);margin-top:2px}
td.ms{color:#c4501f;font-weight:800}
td.go2{cursor:pointer}td.go2:hover{background:#f3f7ff}
.search input{border:0;background:none;outline:none;font:inherit;color:var(--ink);width:100%}
.view span{cursor:pointer}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg a{font-size:14px;font-weight:800;color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:999px;white-space:nowrap}
.seg a:hover{color:var(--ink)}
.seg a.on{background:var(--ink);color:#fff}
.pair{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.pair .pl{color:var(--muted);font-weight:700}
.pair a{color:var(--c);font-weight:800;text-decoration:none;background:color-mix(in srgb,var(--c) 10%,white);padding:5px 10px;border-radius:8px}
.pair a:hover{background:var(--c);color:#fff}
.pair span.off{color:#9aa6bf;font-weight:700;background:#eef2f9;padding:5px 10px;border-radius:8px}
.card.hl{outline:4px solid var(--c);outline-offset:3px;animation:hlp 1s ease 2}
@keyframes hlp{50%{outline-color:transparent}}
.search{margin-left:auto}

.sres{display:none;margin:4px 2px 14px;color:var(--muted);font-size:15px}
.mtag{position:absolute;right:12px;top:12px;background:#fff;color:var(--ink);font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.empty{grid-column:1/-1;text-align:center;padding:50px 0;color:var(--muted)}
.qr{cursor:pointer;background:#fff}
.shr{text-align:left}.shr h3{text-align:center}.shr .sub{text-align:center;color:var(--muted);font-size:14px;margin:-2px 0 14px}
.shr .urow{display:flex;gap:8px;align-items:stretch}
.modal .shr .urow input{width:auto;flex:1 1 auto;min-width:0;font:inherit;font-size:14px;letter-spacing:0;text-align:left;padding:11px 12px;border:2px solid var(--line);border-radius:12px;color:var(--ink);background:#f8faff}
.modal .shr .cp{width:auto;margin:0;flex:0 0 auto;border:0;border-radius:12px;padding:0 16px;font:inherit;font-size:15px;font-weight:900;color:#fff;background:var(--c);cursor:pointer;white-space:nowrap}
.shr .cp.ok{background:#14a05a}
.shr .qrw{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.shr .qrw img{width:120px;height:120px;border-radius:8px;flex:none}.shr .qrw p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}.shr .qrw b{color:var(--ink)}
.modal .shr .ns{width:100%;margin-top:12px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer}
.shr .ns:hover{border-color:var(--c);color:var(--c)}
.qr.sh{gap:4px}

.qr.sh{width:auto;padding:0 12px;white-space:nowrap;font-size:14px;color:var(--ink)}
.qr.sh:hover{border-color:var(--c);color:var(--c)}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#14a05a;color:#fff;font-weight:800;font-size:15px;padding:12px 22px;border-radius:999px;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.2);animation:pop .2s ease}
.go{cursor:pointer}
body.yearmode #grid,body.yearmode .legend{display:none}
body.yearmode .year{margin-top:6px}
body.searching .tabs,body.searching .mhead,body.searching .year,body.searching .legend{display:none}
body.searching .sres{display:block}
/* modal */
.mask{position:fixed;inset:0;background:rgba(10,18,40,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:22px;width:min(420px,100%);padding:28px 26px 24px;box-shadow:0 30px 60px rgba(0,0,0,.25);text-align:center;position:relative;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
.modal .lk{width:56px;height:56px;border-radius:16px;background:var(--c);color:#fff;font-size:26px;display:grid;place-items:center;margin:0 auto 12px}
.modal h3{font-size:20px;margin-bottom:6px}
.modal p{color:var(--muted);font-size:14px;margin-bottom:16px;line-height:1.5}
.modal input{width:100%;font:inherit;font-size:17px;padding:13px 16px;border:2px solid var(--line);border-radius:12px;outline:none;text-align:center;letter-spacing:2px}
.modal input:focus{border-color:var(--c)}
.modal .err{color:#e5484d;font-size:13px;height:18px;margin-top:6px;font-weight:700}
.modal .ok{width:100%;margin-top:8px;border:0;background:var(--c);color:#fff;font:inherit;font-size:16px;font-weight:800;padding:13px;border-radius:12px;cursor:pointer}
.modal .qrimg{width:260px;max-width:100%;border-radius:12px;border:1px solid var(--line)}
.modal .url{font-size:12px;color:var(--muted);word-break:break-all;margin-top:8px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:760px){
 .seg{margin-left:auto}.seg a{padding:6px 9px;font-size:12px}
 .hin{flex-wrap:wrap;height:auto;padding:10px 16px;row-gap:8px}.hin b{font-size:16px;white-space:nowrap}
 .search{order:3;width:100%;margin:0}
 .hin small,.hin .sep{display:none}
 .heroin{padding:28px 18px 80px}.hero h1{font-size:28px}
 main{padding:0 16px 40px}.tabs{overflow-x:auto}.tab{padding:10px 16px 10px 10px}
 .grid{grid-template-columns:1fr 1fr;gap:12px}.body{padding:12px}.body h3{font-size:15px}.goal{display:none}.mhead .view{display:none}
 .year{display:none}.legend{flex-wrap:wrap;gap:8px 14px}.legend span{white-space:nowrap}
 .qr.sh{padding:0 10px;font-size:13px}
}
html,body{overflow-x:hidden}
</style></head><body>

 <div class="year"><h4 id="yh"></h4><table id="yt"></table></div>
</main>

function sha256(s){const K=[],H=[];let n=2,c=0;const isP=x=>{for(let f=2;f*f<=x;f++)if(x%f==0)return 0;return 1};const fr=x=>(x-Math.floor(x))*4294967296|0;while(c<64){if(isP(n)){if(c<8)H[c]=fr(Math.pow(n,1/2));K[c++]=fr(Math.pow(n,1/3))}n++}
 const b=new TextEncoder().encode(s),l=b.length,w=new Uint32Array(((l+9+63)>>6)<<4);for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-(i%4)*8);w[l>>2]|=0x80<<(24-(l%4)*8);w[w.length-1]=l*8;
 const h=H.slice(),r=(x,y)=>(x>>>y)|(x<<(32-y)),W=new Array(64);
 for(let j=0;j<w.length;j+=16){let [a,bb,cc,d,e,f,g,hh]=h;for(let i=0;i<64;i++){if(i<16)W[i]=w[j+i]|0;else{const x=W[i-15],y=W[i-2];W[i]=(W[i-16]+(r(x,7)^r(x,18)^(x>>>3))+W[i-7]+(r(y,17)^r(y,19)^(y>>>10)))|0}
  const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
  h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+cc)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}
 return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
